[project]
name = "binance-platform"
version = "0.1.0"
description = "QuantStrategyLab platform layer for Binance exchange."
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@3b74a445b370745fcb7bc380b4f37e9bf2f7cf56",
  "crypto-strategies @ git+https://github.com/QuantStrategyLab/CryptoStrategies.git@932b16a6a01350e924ba0d51344fcac284dbe496",
  "python-binance",
  "pandas",
  "numpy",
  "requests",
  "google-cloud-firestore",
  "google-cloud-storage",
  "functions-framework",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@3b74a445b370745fcb7bc380b4f37e9bf2f7cf56",
]

[tool.ruff]
ignore = ["E701", "E702", "E401", "F541"]
