[project]
name = "binance-platform"
version = "0.1.0"
description = "QuantStrategyLab platform layer for Binance exchange."
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@e7d8659ef5b8f66660ea58f58202735fa3508cc1",
  "crypto-strategies @ git+https://github.com/QuantStrategyLab/CryptoStrategies.git@621d7344688c067fcde22b39a60ee28d76f21611",
  "python-binance",
  "pandas",
  "numpy",
  "requests",
  "google-cloud-firestore",
  "google-cloud-storage",
  "functions-framework",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@e7d8659ef5b8f66660ea58f58202735fa3508cc1",
]

[tool.ruff]
ignore = ["E701", "E702", "E401", "F541"]
