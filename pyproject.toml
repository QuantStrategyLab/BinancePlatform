[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-platform"
version = "0.1.0"
description = "QuantStrategyLab platform layer for Binance exchange."
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@155d74a615ccdebf7223787939c2dc7151d75efd",
  "crypto-strategies @ git+https://github.com/QuantStrategyLab/CryptoStrategies.git@97243177237dde23ad4f71b4205de4a54e822332",
  "python-binance",
  "pandas",
  "numpy",
  "requests",
  "google-cloud-firestore",
  "google-cloud-storage",
  "functions-framework",
]

[project.optional-dependencies]
test = [
  "boto3==1.44.9",
  "pytest>=8",
  "ruff>=0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binance_platform = ["notifications/*.json", "notifications/digest_snapshot/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/binance_platform"]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@155d74a615ccdebf7223787939c2dc7151d75efd",
]

[tool.ruff]
ignore = ["E701", "E702", "E401", "F541"]
