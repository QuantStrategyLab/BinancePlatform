[project]
name = "binance-platform"
version = "0.1.0"
description = "QuantStrategyLab platform layer for Binance exchange."
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@1a6ed98eea5d69ebe6d09ec1cb1e6ec10c4faeed",
  "crypto-strategies @ git+https://github.com/QuantStrategyLab/CryptoStrategies.git@5144b19fba9761eb7f4e386d47118b45f47ab3d4",
  "python-binance",
  "pandas",
  "numpy",
  "requests",
  "google-cloud-firestore",
  "google-cloud-storage",
  "functions-framework",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@1a6ed98eea5d69ebe6d09ec1cb1e6ec10c4faeed",
]

[tool.ruff]
ignore = ["E701", "E702", "E401", "F541"]
