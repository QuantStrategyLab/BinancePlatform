[project]
name = "binance-platform"
version = "0.1.0"
description = "QuantStrategyLab platform layer for Binance exchange."
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@1e5ecacd3843691fe1a82e620ab00e72794c0407",
  "crypto-strategies @ git+https://github.com/QuantStrategyLab/CryptoStrategies.git@44c7b7584b15f2b9ad0a93d8c236deb2ba8b9ed9",
  "python-binance",
  "pandas",
  "numpy",
  "requests",
  "google-cloud-firestore",
  "google-cloud-storage",
  "functions-framework",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@1e5ecacd3843691fe1a82e620ab00e72794c0407",
]

[tool.ruff]
ignore = ["E701", "E702", "E401", "F541"]
