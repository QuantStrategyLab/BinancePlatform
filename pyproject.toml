[project]
name = "binance-platform"
version = "0.1.0"
description = "QuantStrategyLab platform layer for Binance exchange."
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@cd6edbb32bb85ec6d280c2dafea4dd8ecd3ccdab",
  "crypto-strategies @ git+https://github.com/QuantStrategyLab/CryptoStrategies.git@c43241bb0d55e483d6b6fbe99761ebe5cda032cc",
  "python-binance",
  "pandas",
  "numpy",
  "requests",
  "google-cloud-firestore",
  "google-cloud-storage",
  "functions-framework",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@cd6edbb32bb85ec6d280c2dafea4dd8ecd3ccdab",
]

[tool.ruff]
ignore = ["E701", "E702", "E401", "F541"]
