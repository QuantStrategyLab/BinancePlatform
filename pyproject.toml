[project]
name = "binance-platform"
version = "0.1.0"
description = "QuantStrategyLab platform layer for Binance exchange."
requires-python = ">=3.11"
dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@8e8ec51884bf8abb0a7ca699fc2da39fad134f89",
  "crypto-strategies @ git+https://github.com/QuantStrategyLab/CryptoStrategies.git@7fcca8ee0280b3e66245eb673caadda8b8b3b9a3",
  "python-binance",
  "pandas",
  "numpy",
  "requests",
  "google-cloud-firestore",
  "google-cloud-storage",
  "functions-framework",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@8e8ec51884bf8abb0a7ca699fc2da39fad134f89",
]

[tool.ruff]
ignore = ["E701", "E702", "E401", "F541"]
