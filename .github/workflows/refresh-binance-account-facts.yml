name: Refresh Binance Account Facts

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      enabled:
        description: "Run one read-only account-facts refresh; the repository gate must also be enabled."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dispatch-account-facts-read:
    if: >-
      github.repository == 'QuantStrategyLab/BinancePlatform' &&
      github.ref == 'refs/heads/main' &&
      vars.BINANCE_ACCOUNT_FACTS_REFRESH_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.enabled == true))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the fixed read-only account-facts workflow
        shell: python
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          api_url = os.environ.get("GITHUB_API_URL", "").rstrip("/")
          token = os.environ.get("GITHUB_TOKEN", "")
          if not api_url or not token:
              print("account_facts_dispatch_not_configured", file=sys.stderr)
              raise SystemExit(1)

          url = (
              f"{api_url}/repos/QuantStrategyLab/BinancePlatform/actions/"
              "workflows/binance-account-facts.yml/dispatches"
          )
          payload = {
              "ref": "runtime-production",
              "inputs": {"enabled": True, "source_mode": "direct_read"},
          }
          request = Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )

          class RejectRedirects(HTTPRedirectHandler):
              def redirect_request(self, _request, _file, _code, _message, _headers, _url):
                  return None

          opener = build_opener(RejectRedirects)

          try:
              with opener.open(request, timeout=30) as response:
                  if response.status not in (200, 204):
                      print("account_facts_dispatch_outcome_unknown", file=sys.stderr)
                      raise SystemExit(1)
          except HTTPError as error:
              if 400 <= error.code < 500:
                  print("account_facts_dispatch_rejected", file=sys.stderr)
              else:
                  print("account_facts_dispatch_outcome_unknown", file=sys.stderr)
              raise SystemExit(1)
          except (URLError, TimeoutError, OSError):
              print("account_facts_dispatch_outcome_unknown", file=sys.stderr)
              raise SystemExit(1)

          print("account_facts_dispatch=accepted")
