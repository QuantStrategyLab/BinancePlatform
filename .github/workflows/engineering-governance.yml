name: Engineering governance

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned PrGovernance scanner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Pigbibi/PrGovernance
          ref: ccda8de572d2893272b0137526ef3e2d45e5eee7
          path: .pr-governance-tool
          persist-credentials: false
      - name: Scan added commits with redacted findings
        shell: bash
        run: |
          set -euo pipefail
          mv .pr-governance-tool "$RUNNER_TEMP/pr-governance"
          bash "$RUNNER_TEMP/pr-governance/pr-governance/scripts/install-gitleaks.sh"
          base="$(jq -r '.pull_request.base.sha // .before // empty' "$GITHUB_EVENT_PATH")"
          head="$(jq -r '.pull_request.head.sha // .after // .sha // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No base commit is available for this event; the pull request scan covers the branch" >&2
            exit 0
          fi
          python3 "$RUNNER_TEMP/pr-governance/pr-governance/scripts/secret_scan.py" range \
            --root "$GITHUB_WORKSPACE" \
            --base "$base" \
            --head "$head" \
            --gitleaks "$RUNNER_TEMP/gitleaks-bin/gitleaks"

  commitlint:
    name: Commit message convention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/governance-commitlint"
          npm install --prefix "$tool" --ignore-scripts --no-audit --no-fund \
            @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
          printf '%s\n' "module.exports = {extends: [require.resolve('@commitlint/config-conventional')], defaultIgnores: true, ignores: [(message) => /^(Merge |Merge bypass)/.test(message)], rules: {'subject-case': [0], 'body-max-line-length': [0], 'header-max-length': [2, 'always', 72], 'type-enum': [2, 'always', ['feat', 'fix', 'docs', 'refactor', 'test', 'chore', 'perf', 'ci', 'build']]}};" > "$tool/commitlint.config.cjs"
          node "$tool/node_modules/@commitlint/cli/cli.js" \
            --config "$tool/commitlint.config.cjs" --from "$PR_BASE" --to "$PR_HEAD" --verbose
