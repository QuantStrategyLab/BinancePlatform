name: Authority App authentication check

# Configuration access only: no authority materialization, writes or trading.
on:
  workflow_dispatch:

permissions: {}

jobs:
  authenticate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: binance-runtime
    steps:
      - name: Mint scoped read-only installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BINANCE_AUTHORITY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BINANCE_AUTHORITY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-environments: read
          permission-metadata: read
        env:
          # v3.2.0 parses this undeclared input into actions_variables.
          INPUT_PERMISSION-ACTIONS-VARIABLES: read

      - name: Verify installation scope and configuration reads
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          actual=$(gh api installation/repositories --jq '.repositories | map(.full_name) | sort | join(",")')
          if [ "$actual" != "$REPOSITORY" ]; then
            echo "::error::Installation token repository scope does not match."
            exit 1
          fi
          gh api --silent "repos/${REPOSITORY}/actions/runs?per_page=1"
          gh api --silent "repos/${REPOSITORY}/actions/variables/RUNTIME_TARGET_ENABLED"
          gh api --silent "repos/${REPOSITORY}/environments/binance-runtime/variables/BINANCE_AUTHORITY_APP_CLIENT_ID"
          gh api --silent "repos/${REPOSITORY}/environments/binance-runtime/secrets/public-key"
          echo "Scoped GitHub App authentication verified; no configuration writes."
