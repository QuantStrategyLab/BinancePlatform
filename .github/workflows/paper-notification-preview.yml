name: PAPER Notification Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-notification-preview-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    name: Send PAPER Telegram notification preview pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Production runtime target stays fail-closed for this manual preview path.
      RUNTIME_TARGET_ENABLED: "false"
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ vars.GLOBAL_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      - name: Send PAPER notification preview pack
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: uv run --no-sync python scripts/send_paper_notification_preview.py
