name: Runtime
run-name: Runtime · ${{ inputs.recovery_action == 'prepare-github' && 'prepare GitHub recovery candidate' || inputs.recovery_action == 'verify-github' && 'GitHub recovery verification' || inputs.full_cycle && 'full-cycle-validation' || inputs.validate_only && 'validation' || inputs.reconcile_only && 'reconciliation' || vars.RUNTIME_TARGET_ENABLED == 'true' && 'strategy' || 'disabled' }}

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Validate actual configuration, recovery control and strategy startup without broker credentials or execution"
        required: false
        default: false
        type: boolean
      full_cycle:
        description: "With validate_only: run one read-only full cycle; runtime remains disabled and all writes are suppressed"
        required: false
        default: false
        type: boolean
      reconcile_only:
        description: "Run only the read-only frozen-baseline reconciliation collector"
        required: false
        default: false
        type: boolean
      reconcile_persist_candidate:
        description: "Persist the redacted reconciliation candidate as a short-lived artifact"
        required: false
        default: false
        type: boolean
      diagnose_balances:
        description: "With reconcile_only: diagnose balance hashes without a candidate or writes"
        required: false
        default: false
        type: boolean
      balance_history_start:
        description: "Optional balance diagnosis history start (ISO 8601 with timezone, at most 7 days)."
        type: string
        required: false
      balance_history_end:
        description: "Optional balance diagnosis history end (ISO 8601 with timezone)."
        type: string
        required: false
      recovery_action:
        description: "Explicit no-order recovery step; requires disabled runtime and reconcile_only"
        type: choice
        required: false
        default: none
        options: [none, diagnose, prepare, verify, activate, prepare-github, verify-github]
      recovery_id:
        description: "Exact prepared recovery ID; required for verification or activation"
        type: string
        required: false
      recovery_candidate_sha256:
        description: "Exact candidate SHA-256 from the prepare run; required for verify-github"
        type: string
        required: false
      accounting_migration_action:
        description: "Explicit accounting step; scope-preview posts a private read-only report to the console"
        type: choice
        required: false
        default: none
        options: [none, inspect, quiesce, earn-forward-diagnose, audit, preview, scope-preview, cash-flow-preview, rebase-proposal, rebase-apply, prospective-rebase-apply, release-stale-owner, apply]
      proposal_recipient_certificate:
        description: "Public X.509 encryption certificate for rebase-proposal only; never provide a private key"
        type: string
        required: false
      accounting_migration_preview_run_id:
        description: "Exact successful preview run ID; required only for apply"
        type: string
        required: false
      accounting_migration_expected_digest:
        description: "Exact approved preview candidate digest; required only for apply"
        type: string
        required: false
      candidate_release_sha:
        description: "Optional full 40-char commit SHA for validate_only+full_cycle candidate checkout only; selects code, does not grant authority"
        type: string
        required: false

permissions:
  actions: read
  contents: read
  id-token: write

# Preserve the existing runtime lock across protected job execution.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  recovery-review-input:
    if: ${{ inputs.recovery_action == 'verify-github' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Show the exact candidate before requesting approval
        shell: bash
        env:
          RECOVERY_ID: ${{ inputs.recovery_id }}
          CANDIDATE_SHA: ${{ inputs.recovery_candidate_sha256 }}
          APPROVED_WORKFLOW_SHA: ${{ vars.BINANCE_RECOVERY_WORKFLOW_SHA }}
          REVIEWER_ID: ${{ vars.BINANCE_RECOVERY_REVIEWER_ID }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only }}
          RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$APPROVED_WORKFLOW_SHA"
          test "$RECONCILE_ONLY" = true
          test "$RUNTIME_TARGET_ENABLED" = false
          [[ "$REVIEWER_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RECOVERY_ID" =~ ^binance-([1-9][0-9]*)-[1-9][0-9]*$ ]]
          printf 'Candidate: %s\n\nSHA-256: %s\n\n[Prepare run](https://github.com/%s/actions/runs/%s)\n' \
            "$RECOVERY_ID" "$CANDIDATE_SHA" "$GITHUB_REPOSITORY" "${BASH_REMATCH[1]}" >> "$GITHUB_STEP_SUMMARY"

  recovery-review:
    if: ${{ inputs.recovery_action == 'verify-github' }}
    needs: recovery-review-input
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: binance-recovery-review
    permissions: {}
    steps:
      - run: echo 'GitHub released the candidate review job.'

  deploy:
    needs: recovery-review
    if: ${{ !cancelled() && (inputs.recovery_action != 'verify-github' || needs.recovery-review.result == 'success') }}
    uses: ./.github/workflows/runtime-protected.yml
    with:
      validate_only: ${{ inputs.validate_only }}
      full_cycle: ${{ inputs.full_cycle }}
      reconcile_only: ${{ inputs.reconcile_only }}
      reconcile_persist_candidate: ${{ inputs.reconcile_persist_candidate }}
      diagnose_balances: ${{ inputs.diagnose_balances }}
      balance_history_start: ${{ inputs.balance_history_start }}
      balance_history_end: ${{ inputs.balance_history_end }}
      recovery_action: ${{ inputs.recovery_action || 'none' }}
      recovery_id: ${{ inputs.recovery_id }}
      recovery_candidate_sha256: ${{ inputs.recovery_candidate_sha256 }}
      accounting_migration_action: ${{ inputs.accounting_migration_action || 'none' }}
      proposal_recipient_certificate: ${{ inputs.proposal_recipient_certificate }}
      accounting_migration_preview_run_id: ${{ inputs.accounting_migration_preview_run_id }}
      accounting_migration_expected_digest: ${{ inputs.accounting_migration_expected_digest }}
      candidate_release_sha: ${{ inputs.candidate_release_sha }}
    secrets:
      PRIVATE_RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON }}
      PRIVATE_DIGEST_CANDIDATES_GCS_URI: ${{ vars.DIGEST_CANDIDATES_GCS_URI || secrets.DIGEST_CANDIDATES_GCS_URI }}
      PRIVATE_EXECUTION_REPORT_GCS_URI: ${{ vars.EXECUTION_REPORT_GCS_URI }}
      PRIVATE_DIGEST_STORE_TARGET: ${{ vars.DIGEST_STORE_TARGET || secrets.BINANCE_DIGEST_STORE_TARGET }}
      PRIVATE_GLOBAL_TELEGRAM_CHAT_ID: ${{ vars.GLOBAL_TELEGRAM_CHAT_ID }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      BINANCE_APPROVED_PROSPECTIVE_OPENING: ${{ secrets.BINANCE_APPROVED_PROSPECTIVE_OPENING }}
      BINANCE_DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.BINANCE_DIGEST_OPAQUE_ACCOUNT_UID }}
      BINANCE_DIGEST_STORE_TARGET: ${{ secrets.BINANCE_DIGEST_STORE_TARGET }}
      BINANCE_DIGEST_TARGET_ID: ${{ secrets.BINANCE_DIGEST_TARGET_ID }}
      BINANCE_RISK_AUTHORITY_JSON: ${{ secrets.BINANCE_RISK_AUTHORITY_JSON }}
      DIGEST_CANDIDATES_GCS_URI: ${{ secrets.DIGEST_CANDIDATES_GCS_URI }}
      DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.DIGEST_OPAQUE_ACCOUNT_UID }}
      DIGEST_TARGET_ID: ${{ secrets.DIGEST_TARGET_ID }}
      EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}
      RECONCILIATION_RECOVERY_CONTROLLER_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_CONTROLLER_TOKEN }}
      RECONCILIATION_RECOVERY_SYNC_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_SYNC_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
