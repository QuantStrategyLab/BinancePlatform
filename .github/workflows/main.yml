name: Runtime
run-name: Runtime · ${{ inputs.validate_only && 'validation' || inputs.reconcile_only && 'reconciliation' || vars.RUNTIME_TARGET_ENABLED == 'true' && 'strategy' || 'disabled' }}

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Validate actual configuration, recovery control and strategy startup without broker credentials or execution"
        required: false
        default: false
        type: boolean
      reconcile_only:
        description: "Run only the read-only frozen-baseline reconciliation collector"
        required: false
        default: false
        type: boolean
      reconcile_persist_candidate:
        description: "Persist the redacted reconciliation candidate as a short-lived artifact"
        required: false
        default: false
        type: boolean
      diagnose_balances:
        description: "With reconcile_only: diagnose balance hashes without a candidate or writes"
        required: false
        default: false
        type: boolean
      balance_history_start:
        description: "Optional balance diagnosis history start (ISO 8601 with timezone, at most 7 days)."
        type: string
        required: false
      balance_history_end:
        description: "Optional balance diagnosis history end (ISO 8601 with timezone)."
        type: string
        required: false
      recovery_action:
        description: "Explicit no-order recovery step; requires disabled runtime and reconcile_only"
        type: choice
        required: false
        default: none
        options: [none, diagnose, prepare, verify, activate]
      recovery_id:
        description: "Exact prepared recovery ID; required for verify or activate"
        type: string
        required: false
      accounting_migration_action:
        description: "Explicit daily-accounting migration step; preview is read-only and apply requires separate approval"
        type: choice
        required: false
        default: none
        options: [none, inspect, quiesce, audit, preview, rebase-proposal, rebase-apply, apply]
      proposal_recipient_certificate:
        description: "Public X.509 encryption certificate for rebase-proposal only; never provide a private key"
        type: string
        required: false
      accounting_migration_preview_run_id:
        description: "Exact successful preview run ID; required only for apply"
        type: string
        required: false
      accounting_migration_expected_digest:
        description: "Exact approved preview candidate digest; required only for apply"
        type: string
        required: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
  # This is the one operator-facing stop control.  A missing value fails
  # closed; the reviewed repository variable is explicitly set to true.
  RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED || 'false' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    environment: binance-runtime
    outputs:
      runtime_target_enabled: ${{ steps.runtime-target-control.outputs.enabled }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: 0. Validate runtime target control
        id: runtime-target-control
        shell: bash
        env:
          RECOVERY_ACTION_INPUT: ${{ inputs.recovery_action || 'none' }}
          DIAGNOSE_BALANCES_INPUT: ${{ inputs.diagnose_balances || 'false' }}
          RECONCILE_ONLY_INPUT: ${{ inputs.reconcile_only || 'false' }}
          RECONCILE_PERSIST_INPUT: ${{ inputs.reconcile_persist_candidate || 'false' }}
          VALIDATE_ONLY_INPUT: ${{ inputs.validate_only || 'false' }}
          BALANCE_HISTORY_START: ${{ inputs.balance_history_start }}
          BALANCE_HISTORY_END: ${{ inputs.balance_history_end }}
          ACCOUNTING_MIGRATION_ACTION_INPUT: ${{ inputs.accounting_migration_action || 'none' }}
          PROPOSAL_RECIPIENT_CERTIFICATE: ${{ inputs.proposal_recipient_certificate }}
          ACCOUNTING_MIGRATION_PREVIEW_RUN_ID: ${{ inputs.accounting_migration_preview_run_id }}
          ACCOUNTING_MIGRATION_EXPECTED_DIGEST: ${{ inputs.accounting_migration_expected_digest }}
        run: |
          set -euo pipefail
          case "${RECOVERY_ACTION_INPUT:-none}" in
            none) ;;
            diagnose|prepare|verify|activate)
              if [ "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" != "none" ] || [ "${GITHUB_REF:-}" != "refs/heads/main" ] || [ "${RUNTIME_TARGET_ENABLED:-}" != "false" ] || [ "$RECONCILE_ONLY_INPUT" != "true" ] || [ "$VALIDATE_ONLY_INPUT" = "true" ] || [ "$DIAGNOSE_BALANCES_INPUT" = "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ]; then
                echo "::error::Recovery requires disabled main runtime, reconcile_only, and no other diagnostic mode."
                exit 1
              fi
              ;;
            *) echo "::error::Unknown recovery action."; exit 1 ;;
          esac
          case "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" in
            none)
              if [ -n "${ACCOUNTING_MIGRATION_PREVIEW_RUN_ID:-}${ACCOUNTING_MIGRATION_EXPECTED_DIGEST:-}" ]; then
                echo "::error::Migration artifact inputs require an explicit apply action."
                exit 1
              fi
              ;;
            inspect|quiesce|audit|preview|rebase-proposal|rebase-apply|apply)
              if [ "${RECOVERY_ACTION_INPUT:-none}" != "none" ] || [ "${GITHUB_REF:-}" != "refs/heads/main" ] || [ "${RUNTIME_TARGET_ENABLED:-}" != "false" ] || [ "$RECONCILE_ONLY_INPUT" != "true" ] || [ "$VALIDATE_ONLY_INPUT" = "true" ] || [ "$DIAGNOSE_BALANCES_INPUT" = "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ]; then
                echo "::error::Accounting migration requires disabled main runtime, reconcile_only, and no other recovery or diagnostic mode."
                exit 1
              fi
              if [ "$ACCOUNTING_MIGRATION_ACTION_INPUT" != "apply" ]; then
                if [ -n "${ACCOUNTING_MIGRATION_PREVIEW_RUN_ID:-}${ACCOUNTING_MIGRATION_EXPECTED_DIGEST:-}" ]; then
                  echo "::error::Only apply accepts an artifact run or expected digest."
                  exit 1
                fi
              elif [[ ! "${ACCOUNTING_MIGRATION_PREVIEW_RUN_ID:-}" =~ ^[0-9]+$ ]] || [[ ! "${ACCOUNTING_MIGRATION_EXPECTED_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::Apply requires an exact preview run ID and candidate digest."
                exit 1
              fi
              ;;
            *) echo "::error::Unknown accounting migration action."; exit 1 ;;
          esac
          if [ "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" = "rebase-proposal" ]; then
            if [ -z "${PROPOSAL_RECIPIENT_CERTIFICATE:-}" ]; then
              echo "::error::Rebase proposal requires a public encryption certificate."
              exit 1
            fi
          elif [ -n "${PROPOSAL_RECIPIENT_CERTIFICATE:-}" ]; then
            echo "::error::Only rebase-proposal accepts a public encryption certificate."
            exit 1
          fi
          if [ -n "${BALANCE_HISTORY_START:-}${BALANCE_HISTORY_END:-}" ]; then
            if [ "$DIAGNOSE_BALANCES_INPUT" != "true" ] || [ -z "${BALANCE_HISTORY_START:-}" ] || [ -z "${BALANCE_HISTORY_END:-}" ]; then
              echo "::error::Balance history requires balance diagnostics and both window bounds."
              exit 1
            fi
          fi
          if [ "$DIAGNOSE_BALANCES_INPUT" = "true" ]; then
            if [ "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" != "none" ] || [ "$RECONCILE_ONLY_INPUT" != "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ] || [ "$VALIDATE_ONLY_INPUT" = "true" ]; then
              echo "::error::Balance diagnostics require reconcile_only and forbid persistence or validate_only."
              exit 1
            fi
          fi
          case "${RUNTIME_TARGET_ENABLED,,}" in
            true|false) ;;
            *)
              echo "::error::RUNTIME_TARGET_ENABLED must be true or false."
              exit 1
              ;;
          esac
          echo "enabled=${RUNTIME_TARGET_ENABLED,,}" >> "$GITHUB_OUTPUT"
          if [ "${RUNTIME_TARGET_ENABLED,,}" = "false" ]; then
            echo "observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout disabled host observation producer
        if: ${{ steps.runtime-target-control.outputs.enabled == 'false' && github.event.inputs.reconcile_only != 'true' && github.event.inputs.validate_only != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare disabled host observation
        id: disabled-host
        if: ${{ steps.runtime-target-control.outputs.enabled == 'false' && github.event.inputs.reconcile_only != 'true' && github.event.inputs.validate_only != 'true' }}
        shell: bash
        env:
          RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON }}
          RUNTIME_TARGET_ENABLED: ${{ steps.runtime-target-control.outputs.enabled }}
          RUNTIME_TARGET_CONTROL_OBSERVED_AT: ${{ steps.runtime-target-control.outputs.observed_at }}
          EXECUTION_EVIDENCE_SYNC_URL: ${{ vars.EXECUTION_EVIDENCE_SYNC_URL }}
          EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/runtime_target_lifecycle_status.py
          if [ -n "${EXECUTION_EVIDENCE_SYNC_URL:-}" ] && [ -n "${EXECUTION_EVIDENCE_SYNC_TOKEN:-}" ]; then
            echo "publish_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "Disabled host observation not published: state ingress unavailable."
          fi

      - name: Publish disabled host observation
        if: ${{ steps.disabled-host.outputs.publish_ready == 'true' }}
        uses: QuantStrategyLab/QuantRuntimeSettings/actions/publish-runtime-target-lifecycle@1c2e09802b6a31463445d8429826d20e93c6432c
        with:
          source-id: binance.runtime-target-lifecycle
          target-id: ${{ steps.disabled-host.outputs.target_id }}
          platform: binance
          configured-state: ${{ steps.disabled-host.outputs.configured_state }}
          execution-mode: ${{ steps.disabled-host.outputs.execution_mode }}
          runtime-guard: ${{ steps.disabled-host.outputs.runtime_guard }}
          execution-heartbeat: not_applicable
          deployment-json: ${{ steps.disabled-host.outputs.deployment_json }}
          sync-url: ${{ vars.EXECUTION_EVIDENCE_SYNC_URL }}
        env:
          EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}

      - name: 0. Validate deployment identity configuration
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository variable ${name} is not configured."
              exit 1
            fi
          done
          readonly EXPECTED_OIDC_IDENTITY_SHA256="68e87a5dc1bbe2e41af33d526514034246c6487fb7b716596cc75fe1c739a6b9"
          actual_oidc_identity_sha256="$(
            printf '%s\0%s\0%s' \
              "$GCP_PROJECT_ID" \
              "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
              "$GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT" |
              sha256sum |
              awk '{print $1}'
          )"
          if [ "$actual_oidc_identity_sha256" != "$EXPECTED_OIDC_IDENTITY_SHA256" ]; then
            echo "::error::Repository OIDC identity variables do not match the reviewed identity contract."
            exit 1
          fi
      - name: 1. Checkout latest code
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 2. Authenticate to Google Cloud
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: 3. Prepare or update dependency environment
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        run: |
          set -euo pipefail
          LOCK_FILE="uv.lock"
          PYTHON_BIN="python3"
          if command -v python3.11 >/dev/null 2>&1; then PYTHON_BIN="python3.11"; fi
          echo "Using interpreter: $PYTHON_BIN ($($PYTHON_BIN --version 2>&1))"

          CACHE_ROOT="${RUNNER_WORKSPACE}/.runtime-cache/binance-platform"
          VENV_PATH="${CACHE_ROOT}/venv"
          HASH_FILE="${CACHE_ROOT}/uv.lock.sha256"
          PYTHON_VERSION_FILE="${CACHE_ROOT}/python.version"
          CURR_HASH=$(sha256sum "$LOCK_FILE" | cut -d' ' -f1)
          CURR_PYTHON_VERSION="$("$PYTHON_BIN" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")')"

          mkdir -p "$CACHE_ROOT"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          VENV_RECREATED=false

          install_with_retry() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              echo "${description} (attempt ${attempt}/3)"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            return 1
          }

          ensure_venv_pip() {
            if "$VENV_PATH/bin/python" -m pip --version >/dev/null 2>&1; then
              return 0
            fi
            echo "pip missing from dependency venv; bootstrapping with ensurepip."
            "$VENV_PATH/bin/python" -m ensurepip --upgrade
          }

          if [ ! -x "$VENV_PATH/bin/python" ]; then
            echo "Creating dependency venv at $VENV_PATH."
            rm -rf "$VENV_PATH"
            "$PYTHON_BIN" -m venv "$VENV_PATH"
            VENV_RECREATED=true
          elif [ ! -f "$PYTHON_VERSION_FILE" ] || [ "$CURR_PYTHON_VERSION" != "$(cat "$PYTHON_VERSION_FILE")" ]; then
            echo "Python version changed; recreating dependency venv."
            rm -rf "$VENV_PATH"
            "$PYTHON_BIN" -m venv "$VENV_PATH"
            VENV_RECREATED=true
          fi
          if [ "$VENV_RECREATED" = "true" ]; then
            rm -f "$HASH_FILE" "$PYTHON_VERSION_FILE"
          fi

          ensure_venv_pip
          install_with_retry "Install uv into dependency venv" \
            "$VENV_PATH/bin/python" -m pip install --upgrade pip uv

          export UV_PROJECT_ENVIRONMENT="$VENV_PATH"
          UV_BIN="$VENV_PATH/bin/uv"

          if [ "$VENV_RECREATED" = "false" ] && [ -f "$HASH_FILE" ] && [ "$CURR_HASH" = "$(cat "$HASH_FILE")" ]; then
            echo "$LOCK_FILE unchanged; reusing cached venv."
          else
            echo "$LOCK_FILE changed or cache is cold; refreshing dependency venv."
          fi

          install_with_retry "Sync runtime dependencies" \
            env UV_PROJECT_ENVIRONMENT="$VENV_PATH" "$UV_BIN" sync --frozen --no-dev

          if [ "$VENV_RECREATED" = "true" ] || [ ! -f "$HASH_FILE" ] || [ "$CURR_HASH" != "$(cat "$HASH_FILE" 2>/dev/null || true)" ]; then
            echo "$CURR_HASH" > "$HASH_FILE"
            echo "$CURR_PYTHON_VERSION" > "$PYTHON_VERSION_FILE"
          fi

      - name: Download approved accounting migration preview
        if: ${{ inputs.accounting_migration_action == 'apply' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binance-accounting-migration-preview
          path: reports/binance-accounting-migration-preview
          run-id: ${{ inputs.accounting_migration_preview_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      # Keep this stable step name: the isolation contract verifies that broker
      # credentials are scoped only here.  `reconcile_only` exits before
      # `main.py` and has no order path.
      - name: 4. Run trading strategy
        id: strategy
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        run: |
          set -euo pipefail
          if [ "${VALIDATE_ONLY:-false}" = "true" ]; then
            env -u BINANCE_API_KEY -u BINANCE_API_SECRET RUNTIME_TARGET_ENABLED=false \
              "$VENV_PATH/bin/python" scripts/validate_runtime_startup.py
            exit 0
          fi
          if [ "${RECONCILE_ONLY:-false}" = "true" ]; then
            if [ "${ACCOUNTING_MIGRATION_ACTION:-none}" != "none" ]; then
              args=("$ACCOUNTING_MIGRATION_ACTION")
              if [ "$ACCOUNTING_MIGRATION_ACTION" = "apply" ]; then
                args+=(--expected-digest "$ACCOUNTING_MIGRATION_EXPECTED_DIGEST")
              fi
              "$VENV_PATH/bin/python" scripts/migrate_daily_accounting_state.py "${args[@]}"
              exit 0
            fi
            if [ "${RECOVERY_ACTION:-none}" != "none" ]; then
              "$VENV_PATH/bin/python" scripts/binance_recovery_controller.py "$RECOVERY_ACTION" --recovery-id "${RECOVERY_ID:-}"
              exit 0
            fi
            if [ "${DIAGNOSE_BALANCES:-false}" = "true" ]; then
              args=(--no-persist --diagnose-balances)
              if [ -n "${BALANCE_HISTORY_START:-}" ]; then
                args+=(--history-start "$BALANCE_HISTORY_START" --history-end "$BALANCE_HISTORY_END")
              fi
              "$VENV_PATH/bin/python" scripts/reconcile_frozen_live_baseline.py "${args[@]}"
              exit 0
            fi
            args=(--no-persist)
            if [ "${RECONCILE_PERSIST_CANDIDATE:-false}" = "true" ]; then
              args=(--output reports/binance-reconciliation-candidate.json)
            fi
            "$VENV_PATH/bin/python" scripts/reconcile_frozen_live_baseline.py "${args[@]}"
            exit 0
          fi
          "$VENV_PATH/bin/python" main.py
        env:
          RECOVERY_ACTION: ${{ inputs.recovery_action || 'none' }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RECONCILIATION_RECOVERY_SYNC_TOKEN: ${{ inputs.recovery_action == 'prepare' && secrets.RECONCILIATION_RECOVERY_SYNC_TOKEN || '' }}
          RECONCILIATION_RECOVERY_CONTROLLER_TOKEN: ${{ (inputs.recovery_action == 'verify' || inputs.recovery_action == 'activate') && secrets.RECONCILIATION_RECOVERY_CONTROLLER_TOKEN || '' }}
          GITHUB_TOKEN: ${{ (inputs.recovery_action == 'diagnose' || inputs.recovery_action == 'prepare' || inputs.recovery_action == 'verify' || inputs.recovery_action == 'activate') && secrets.GITHUB_TOKEN || '' }}
          BINANCE_RECOVERY_CONTROL_ENABLED: ${{ vars.BINANCE_RECOVERY_CONTROL_ENABLED || 'false' }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          STRATEGY_PROFILE: ${{ vars.STRATEGY_PROFILE || 'crypto_live_pool_rotation' }}
          RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON }}
          BINANCE_RECONCILIATION_EXPECTED_DIGESTS_JSON: ${{ vars.BINANCE_RECONCILIATION_EXPECTED_DIGESTS_JSON }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GLOBAL_TELEGRAM_CHAT_ID: ${{ vars.GLOBAL_TELEGRAM_CHAT_ID }}
          NOTIFY_LANG: ${{ vars.NOTIFY_LANG }}
          EXECUTION_REPORT_GCS_URI: ${{ vars.EXECUTION_REPORT_GCS_URI }}
          BINANCE_DRY_RUN: ${{ vars.BINANCE_DRY_RUN || 'true' }}
          STRATEGY_ARTIFACT_FILE: ${{ vars.STRATEGY_ARTIFACT_FILE }}
          STRATEGY_ARTIFACT_MANIFEST_FILE: ${{ vars.STRATEGY_ARTIFACT_MANIFEST_FILE }}
          STRATEGY_ARTIFACT_FIRESTORE_COLLECTION: ${{ vars.STRATEGY_ARTIFACT_FIRESTORE_COLLECTION }}
          STRATEGY_ARTIFACT_FIRESTORE_DOCUMENT: ${{ vars.STRATEGY_ARTIFACT_FIRESTORE_DOCUMENT }}
          STRATEGY_ARTIFACT_MAX_AGE_DAYS: ${{ vars.STRATEGY_ARTIFACT_MAX_AGE_DAYS }}
          STRATEGY_ARTIFACT_ACCEPTABLE_MODES: ${{ vars.STRATEGY_ARTIFACT_ACCEPTABLE_MODES }}
          STRATEGY_ARTIFACT_EXPECTED_SIZE: ${{ vars.STRATEGY_ARTIFACT_EXPECTED_SIZE }}
          STRATEGY_ARTIFACT_ALLOW_NEW_ENTRIES_ON_DEGRADED: ${{ vars.STRATEGY_ARTIFACT_ALLOW_NEW_ENTRIES_ON_DEGRADED }}
          BTC_WEIGHT: ${{ vars.BTC_WEIGHT }}
          TREND_WEIGHT: ${{ vars.TREND_WEIGHT }}
          DYNAMIC_MODE: ${{ vars.DYNAMIC_MODE }}
          DYNAMIC_REGIME_MODE: ${{ vars.DYNAMIC_REGIME_MODE }}
          DYNAMIC_REGIME_OFF_CUT: ${{ vars.DYNAMIC_REGIME_OFF_CUT }}
          DYNAMIC_HARD_SMA200_RATIO: ${{ vars.DYNAMIC_HARD_SMA200_RATIO }}
          DYNAMIC_HARD_MA200_SLOPE: ${{ vars.DYNAMIC_HARD_MA200_SLOPE }}
          DYNAMIC_SOFT_SMA200_RATIO: ${{ vars.DYNAMIC_SOFT_SMA200_RATIO }}
          DYNAMIC_HARD_BTC_WEIGHT: ${{ vars.DYNAMIC_HARD_BTC_WEIGHT }}
          DYNAMIC_HARD_TREND_WEIGHT: ${{ vars.DYNAMIC_HARD_TREND_WEIGHT }}
          DYNAMIC_SOFT_BTC_WEIGHT: ${{ vars.DYNAMIC_SOFT_BTC_WEIGHT }}
          DYNAMIC_SOFT_TREND_WEIGHT: ${{ vars.DYNAMIC_SOFT_TREND_WEIGHT }}
          ROTATION_TOP_N: ${{ vars.ROTATION_TOP_N }}
          TARGET_VOL: ${{ vars.TARGET_VOL }}
          CIRCUIT_BREAKER_ENABLED: ${{ vars.CIRCUIT_BREAKER_ENABLED }}
          ZSCORE_EXIT_RISK_REDUCED_EXPOSURE: ${{ vars.ZSCORE_EXIT_RISK_REDUCED_EXPOSURE }}
          ZSCORE_EXIT_RISK_OFF_EXPOSURE: ${{ vars.ZSCORE_EXIT_RISK_OFF_EXPOSURE }}
          ZSCORE_EXIT_ALLOW_OUTSIDE_EXECUTION_WINDOW: ${{ vars.ZSCORE_EXIT_ALLOW_OUTSIDE_EXECUTION_WINDOW }}
          BINANCE_RECONCILIATION_SYMBOLS: ${{ vars.BINANCE_RECONCILIATION_SYMBOLS }}
          VALIDATE_ONLY: ${{ github.event.inputs.validate_only || 'false' }}
          RECONCILE_ONLY: ${{ github.event.inputs.reconcile_only || 'false' }}
          DIAGNOSE_BALANCES: ${{ github.event.inputs.diagnose_balances || 'false' }}
          BALANCE_HISTORY_START: ${{ inputs.balance_history_start }}
          BALANCE_HISTORY_END: ${{ inputs.balance_history_end }}
          RECONCILE_PERSIST_CANDIDATE: ${{ github.event.inputs.reconcile_persist_candidate || 'false' }}
          ACCOUNTING_MIGRATION_ACTION: ${{ inputs.accounting_migration_action || 'none' }}
          PROPOSAL_RECIPIENT_CERTIFICATE: ${{ inputs.proposal_recipient_certificate }}
          ACCOUNTING_MIGRATION_EXPECTED_DIGEST: ${{ inputs.accounting_migration_expected_digest }}

      - name: Confirm target is intentionally disabled
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'false' }}
        run: echo "Runtime target is disabled; broker strategy was intentionally not invoked."

      - name: 5. Stage execution report for isolated log publisher
        continue-on-error: true
        if: ${{ github.event.inputs.validate_only != 'true' && github.event.inputs.reconcile_only != 'true' && env.RUNTIME_TARGET_ENABLED == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binance-execution-report-${{ github.run_id }}
          path: reports/execution_report.json
          if-no-files-found: warn
          retention-days: 1

      - name: 5b. Retain redacted reconciliation candidate
        if: ${{ always() && github.event.inputs.reconcile_only == 'true' && github.event.inputs.reconcile_persist_candidate == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binance-reconciliation-candidate-${{ github.run_id }}
          path: reports/binance-reconciliation-candidate.json
          if-no-files-found: error
          # Repository policy caps Actions artifacts at seven days. Keep the
          # setting aligned so a successful read-only run is annotation-free.
          retention-days: 7

      - name: Retain redacted accounting migration preview
        if: ${{ always() && inputs.accounting_migration_action == 'preview' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binance-accounting-migration-preview
          path: reports/binance-accounting-migration-preview/candidate.json
          if-no-files-found: error
          retention-days: 1

      - name: Retain encrypted new accounting start proposal
        if: ${{ success() && inputs.accounting_migration_action == 'rebase-proposal' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binance-accounting-rebase-proposal
          path: reports/binance-accounting-rebase-proposal/proposal.cms
          if-no-files-found: error
          retention-days: 1

      - name: 6. Notify Telegram on runtime workflow failure
        if: ${{ failure() && github.event.inputs.validate_only != 'true' && github.event.inputs.reconcile_only != 'true' && env.RUNTIME_TARGET_ENABLED == 'true' && steps.strategy.outputs.runtime_failure_notified != 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${GLOBAL_TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram workflow failure notification skipped: target is not configured."
            exit 0
          fi

          REPORT_FILE="${GITHUB_WORKSPACE}/reports/execution_report.json"
          if [ -f "$REPORT_FILE" ]; then
            echo "Execution report exists; strategy-level runtime handling should already have recorded this failure."
            exit 0
          fi

          case "${NOTIFY_LANG:-zh}" in
            zh*) TITLE="⚠️ Binance 启动失败，尚未生成执行报告。请查看运行日志。" ;;
            *) TITLE="⚠️ Binance startup failed before an execution report was written. Check the run log." ;;
          esac
          MESSAGE=$(printf '%s\n' \
            "$TITLE" \
            "run: #${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT}" \
            "url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          RESPONSE="$(curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${GLOBAL_TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"
          python3 - "${RESPONSE}" <<'PY'
          import json
          import sys

          try:
              payload = json.loads(sys.argv[1])
          except json.JSONDecodeError as exc:
              raise SystemExit("Telegram returned invalid JSON") from exc
          if not isinstance(payload, dict) or payload.get("ok") is not True:
              raise SystemExit("Telegram did not acknowledge workflow failure notification")
          PY
        env:
          NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GLOBAL_TELEGRAM_CHAT_ID: ${{ vars.GLOBAL_TELEGRAM_CHAT_ID }}

  publish-execution-log:
    name: Publish execution log without broker credentials
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.runtime_target_enabled == 'true' && github.event.inputs.validate_only != 'true' && github.event.inputs.reconcile_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download staged execution report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binance-execution-report-${{ github.run_id }}
          path: reports

      - name: Push execution log to logs branch
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LOGS_BRANCH="logs"
          TS="$(date -u +%Y-%m-%dT%H%M)"
          MONTH="${TS:0:7}"
          REPORT_FILE="${GITHUB_WORKSPACE}/reports/execution_report.json"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "No execution report found, skipping log push."
            exit 0
          fi

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TMP_DIR}/logs-repo"
          cd "${TMP_DIR}/logs-repo"

          if git ls-remote --exit-code --heads origin "${LOGS_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${LOGS_BRANCH}:${LOGS_BRANCH}"
            git checkout "${LOGS_BRANCH}"
          else
            git checkout --orphan "${LOGS_BRANCH}"
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          mkdir -p "hourly/${MONTH}"
          cp "$REPORT_FILE" "hourly/${MONTH}/${TS}.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hourly/${MONTH}/${TS}.json"
          git commit -m "execution: ${TS}"
          git push origin "HEAD:${LOGS_BRANCH}"
