name: Protected Runtime

on:
  workflow_call:
    inputs:
      validate_only:
        description: "Validate actual configuration, recovery control and strategy startup without broker credentials or execution"
        required: false
        default: false
        type: boolean
      full_cycle:
        description: "With validate_only: run one read-only full cycle; runtime remains disabled and all writes are suppressed"
        required: false
        default: false
        type: boolean
      reconcile_only:
        description: "Run only the read-only frozen-baseline reconciliation collector"
        required: false
        default: false
        type: boolean
      reconcile_persist_candidate:
        description: "Persist the redacted reconciliation candidate as a short-lived artifact"
        required: false
        default: false
        type: boolean
      diagnose_balances:
        description: "With reconcile_only: diagnose balance hashes without a candidate or writes"
        required: false
        default: false
        type: boolean
      balance_history_start:
        description: "Optional balance diagnosis history start (ISO 8601 with timezone, at most 7 days)."
        type: string
        required: false
      balance_history_end:
        description: "Optional balance diagnosis history end (ISO 8601 with timezone)."
        type: string
        required: false
      recovery_action:
        description: "Explicit no-order recovery step; requires disabled runtime and reconcile_only"
        type: string
        required: false
        default: none
      recovery_id:
        description: "Exact prepared recovery ID; required for verify or activate"
        type: string
        required: false
      accounting_migration_action:
        description: "Explicit accounting step; scope-preview posts a private read-only report to the console"
        type: string
        required: false
        default: none
      proposal_recipient_certificate:
        description: "Public X.509 encryption certificate for rebase-proposal only; never provide a private key"
        type: string
        required: false
      accounting_migration_preview_run_id:
        description: "Exact successful preview run ID; required only for apply"
        type: string
        required: false
      accounting_migration_expected_digest:
        description: "Exact approved preview candidate digest; required only for apply"
        type: string
        required: false
      candidate_release_sha:
        description: "Optional full 40-char commit SHA for validate_only+full_cycle candidate checkout only; selects code, does not grant authority"
        type: string
        required: false
    secrets:
      PRIVATE_RUNTIME_TARGET_JSON:
        required: false
      PRIVATE_DIGEST_CANDIDATES_GCS_URI:
        required: false
      PRIVATE_EXECUTION_REPORT_GCS_URI:
        required: false
      PRIVATE_DIGEST_STORE_TARGET:
        required: false
      PRIVATE_GLOBAL_TELEGRAM_CHAT_ID:
        required: false
      BINANCE_API_KEY:
        required: false
      BINANCE_API_SECRET:
        required: false
      BINANCE_APPROVED_PROSPECTIVE_OPENING:
        required: false
      BINANCE_DIGEST_OPAQUE_ACCOUNT_UID:
        required: false
      BINANCE_DIGEST_STORE_TARGET:
        required: false
      BINANCE_DIGEST_TARGET_ID:
        required: false
      BINANCE_RISK_AUTHORITY_JSON:
        required: false
      DIGEST_CANDIDATES_GCS_URI:
        required: false
      DIGEST_OPAQUE_ACCOUNT_UID:
        required: false
      DIGEST_TARGET_ID:
        required: false
      EXECUTION_EVIDENCE_SYNC_TOKEN:
        required: false
      RECONCILIATION_RECOVERY_CONTROLLER_TOKEN:
        required: false
      RECONCILIATION_RECOVERY_SYNC_TOKEN:
        required: false
      TG_TOKEN:
        required: false

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
  # One operator-facing stop control. Missing values fail closed as false;
  # only the literal repository value true enables the live strategy path.
  RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED || 'false' }}

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    environment: binance-runtime
    outputs:
      runtime_target_enabled: ${{ steps.runtime-target-control.outputs.enabled }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: 0. Validate runtime target control
        id: runtime-target-control
        shell: bash
        env:
          RECOVERY_ACTION_INPUT: ${{ inputs.recovery_action || 'none' }}
          DIAGNOSE_BALANCES_INPUT: ${{ inputs.diagnose_balances || 'false' }}
          RECONCILE_ONLY_INPUT: ${{ inputs.reconcile_only || 'false' }}
          RECONCILE_PERSIST_INPUT: ${{ inputs.reconcile_persist_candidate || 'false' }}
          VALIDATE_ONLY_INPUT: ${{ inputs.validate_only || 'false' }}
          FULL_CYCLE_INPUT: ${{ inputs.full_cycle || 'false' }}
          BALANCE_HISTORY_START: ${{ inputs.balance_history_start }}
          BALANCE_HISTORY_END: ${{ inputs.balance_history_end }}
          ACCOUNTING_MIGRATION_ACTION_INPUT: ${{ inputs.accounting_migration_action || 'none' }}
          PROPOSAL_RECIPIENT_CERTIFICATE: ${{ inputs.proposal_recipient_certificate }}
          ACCOUNTING_MIGRATION_PREVIEW_RUN_ID: ${{ inputs.accounting_migration_preview_run_id }}
          ACCOUNTING_MIGRATION_EXPECTED_DIGEST: ${{ inputs.accounting_migration_expected_digest }}
          CANDIDATE_RELEASE_SHA_INPUT: ${{ inputs.candidate_release_sha }}
        run: |
          set -euo pipefail
          if [ "${FULL_CYCLE_INPUT:-false}" = "true" ] && { [ "$VALIDATE_ONLY_INPUT" != "true" ] || [ "${RUNTIME_TARGET_ENABLED:-}" != "false" ] || [ "$RECONCILE_ONLY_INPUT" = "true" ] || [ "$DIAGNOSE_BALANCES_INPUT" = "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ]; }; then
            echo "::error::Full-cycle validation requires validate_only, disabled runtime, and no reconciliation mode."
            exit 1
          fi
          if [ -n "${CANDIDATE_RELEASE_SHA_INPUT:-}" ]; then
            if [ "$VALIDATE_ONLY_INPUT" != "true" ] || [ "${FULL_CYCLE_INPUT:-false}" != "true" ] || [ "${RUNTIME_TARGET_ENABLED:-}" != "false" ] || [ "$RECONCILE_ONLY_INPUT" = "true" ] || [ "$DIAGNOSE_BALANCES_INPUT" = "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ] || [ "${RECOVERY_ACTION_INPUT:-none}" != "none" ] || [ "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" != "none" ]; then
              echo "::error::candidate_release_sha is only allowed with validate_only+full_cycle while runtime is disabled and no write modes are active."
              exit 1
            fi
          fi
          case "${RECOVERY_ACTION_INPUT:-none}" in
            none) ;;
            diagnose|prepare|verify|activate)
              if [ "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" != "none" ] || [ "${GITHUB_REF:-}" != "refs/heads/main" ] || [ "${RUNTIME_TARGET_ENABLED:-}" != "false" ] || [ "$RECONCILE_ONLY_INPUT" != "true" ] || [ "$VALIDATE_ONLY_INPUT" = "true" ] || [ "$DIAGNOSE_BALANCES_INPUT" = "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ]; then
                echo "::error::Recovery requires disabled main runtime, reconcile_only, and no other diagnostic mode."
                exit 1
              fi
              ;;
            *) echo "::error::Unknown recovery action."; exit 1 ;;
          esac
          case "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" in
            none)
              if [ -n "${ACCOUNTING_MIGRATION_PREVIEW_RUN_ID:-}${ACCOUNTING_MIGRATION_EXPECTED_DIGEST:-}" ]; then
                echo "::error::Migration artifact inputs require an explicit apply action."
                exit 1
              fi
              ;;
            earn-forward-diagnose|historical-continuity-diagnose)
              if [ "$ACCOUNTING_MIGRATION_ACTION_INPUT" = "historical-continuity-diagnose" ] && [ "${GITHUB_REF:-}" != "refs/heads/runtime-production" ]; then
                echo "::error::Historical read-only diagnosis requires the production Runtime ref."
                exit 1
              fi
              case "${GITHUB_REF:-}" in
                refs/heads/main|refs/heads/runtime-production) ;;
                *) echo "::error::Earn diagnosis requires the trusted Runtime ref."; exit 1 ;;
              esac
              if [ "${RUNTIME_TARGET_ENABLED:-}" != "false" ] || [ "$RECONCILE_ONLY_INPUT" != "true" ] || [ "$VALIDATE_ONLY_INPUT" = "true" ] || [ "$FULL_CYCLE_INPUT" = "true" ] || [ "$DIAGNOSE_BALANCES_INPUT" = "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ] || [ "${RECOVERY_ACTION_INPUT:-none}" != "none" ] || [ -n "${CANDIDATE_RELEASE_SHA_INPUT:-}${ACCOUNTING_MIGRATION_PREVIEW_RUN_ID:-}${ACCOUNTING_MIGRATION_EXPECTED_DIGEST:-}${PROPOSAL_RECIPIENT_CERTIFICATE:-}" ]; then
                echo "::error::Earn diagnosis requires disabled reconcile_only without other validation, recovery, persistence or artifact inputs."
                exit 1
              fi
              ;;
            inspect|quiesce|audit|preview|scope-preview|cash-flow-preview|rebase-proposal|rebase-apply|prospective-rebase-apply|release-stale-owner|apply)
              if [ "${RECOVERY_ACTION_INPUT:-none}" != "none" ] || [ "${GITHUB_REF:-}" != "refs/heads/main" ] || [ "${RUNTIME_TARGET_ENABLED:-}" != "false" ] || [ "$RECONCILE_ONLY_INPUT" != "true" ] || [ "$VALIDATE_ONLY_INPUT" = "true" ] || [ "$DIAGNOSE_BALANCES_INPUT" = "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ]; then
                echo "::error::Accounting migration requires disabled main runtime, reconcile_only, and no other recovery or diagnostic mode."
                exit 1
              fi
              if [ "$ACCOUNTING_MIGRATION_ACTION_INPUT" != "apply" ]; then
                if [ -n "${ACCOUNTING_MIGRATION_PREVIEW_RUN_ID:-}${ACCOUNTING_MIGRATION_EXPECTED_DIGEST:-}" ]; then
                  echo "::error::Only apply accepts an artifact run or expected digest."
                  exit 1
                fi
              elif [[ ! "${ACCOUNTING_MIGRATION_PREVIEW_RUN_ID:-}" =~ ^[0-9]+$ ]] || [[ ! "${ACCOUNTING_MIGRATION_EXPECTED_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::Apply requires an exact preview run ID and candidate digest."
                exit 1
              fi
              ;;
            *) echo "::error::Unknown accounting migration action."; exit 1 ;;
          esac
          if [ "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" = "rebase-proposal" ]; then
            if [ -z "${PROPOSAL_RECIPIENT_CERTIFICATE:-}" ]; then
              echo "::error::Rebase proposal requires a public encryption certificate."
              exit 1
            fi
          elif [ -n "${PROPOSAL_RECIPIENT_CERTIFICATE:-}" ]; then
            echo "::error::Only rebase-proposal accepts a public encryption certificate."
            exit 1
          fi
          if [ -n "${BALANCE_HISTORY_START:-}${BALANCE_HISTORY_END:-}" ]; then
            if [ "$DIAGNOSE_BALANCES_INPUT" != "true" ] || [ -z "${BALANCE_HISTORY_START:-}" ] || [ -z "${BALANCE_HISTORY_END:-}" ]; then
              echo "::error::Balance history requires balance diagnostics and both window bounds."
              exit 1
            fi
          fi
          if [ "$DIAGNOSE_BALANCES_INPUT" = "true" ]; then
            if [ "${ACCOUNTING_MIGRATION_ACTION_INPUT:-none}" != "none" ] || [ "$RECONCILE_ONLY_INPUT" != "true" ] || [ "$RECONCILE_PERSIST_INPUT" = "true" ] || [ "$VALIDATE_ONLY_INPUT" = "true" ]; then
              echo "::error::Balance diagnostics require reconcile_only and forbid persistence or validate_only."
              exit 1
            fi
          fi
          case "${RUNTIME_TARGET_ENABLED,,}" in
            true|false) ;;
            *)
              echo "::error::RUNTIME_TARGET_ENABLED must be true or false."
              exit 1
              ;;
          esac
          echo "enabled=${RUNTIME_TARGET_ENABLED,,}" >> "$GITHUB_OUTPUT"
          if [ "${RUNTIME_TARGET_ENABLED,,}" = "false" ]; then
            echo "observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout disabled host observation producer
        if: ${{ steps.runtime-target-control.outputs.enabled == 'false' && github.event.inputs.reconcile_only != 'true' && github.event.inputs.validate_only != 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare disabled host observation
        id: disabled-host
        if: ${{ steps.runtime-target-control.outputs.enabled == 'false' && github.event.inputs.reconcile_only != 'true' && github.event.inputs.validate_only != 'true' }}
        shell: bash
        env:
          RUNTIME_TARGET_JSON: ${{ secrets.PRIVATE_RUNTIME_TARGET_JSON }}
          RUNTIME_TARGET_ENABLED: ${{ steps.runtime-target-control.outputs.enabled }}
          RUNTIME_TARGET_CONTROL_OBSERVED_AT: ${{ steps.runtime-target-control.outputs.observed_at }}
          EXECUTION_EVIDENCE_SYNC_URL: ${{ vars.EXECUTION_EVIDENCE_SYNC_URL }}
          EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/runtime_target_lifecycle_status.py
          if [ -n "${EXECUTION_EVIDENCE_SYNC_URL:-}" ] && [ -n "${EXECUTION_EVIDENCE_SYNC_TOKEN:-}" ]; then
            echo "publish_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "Disabled host observation not published: state ingress unavailable."
          fi

      - name: Publish disabled host observation
        if: ${{ steps.disabled-host.outputs.publish_ready == 'true' }}
        uses: QuantStrategyLab/QuantRuntimeSettings/actions/publish-runtime-target-lifecycle@f2597e8bfb25881242b13145cb5f42d06ba3476c
        with:
          source-id: binance.runtime-target-lifecycle
          target-id: ${{ steps.disabled-host.outputs.target_id }}
          platform: binance
          configured-state: ${{ steps.disabled-host.outputs.configured_state }}
          execution-mode: ${{ steps.disabled-host.outputs.execution_mode }}
          runtime-guard: ${{ steps.disabled-host.outputs.runtime_guard }}
          execution-heartbeat: not_applicable
          deployment-json: ${{ steps.disabled-host.outputs.deployment_json }}
          sync-url: ${{ vars.EXECUTION_EVIDENCE_SYNC_URL }}
        env:
          EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}

      - name: 0. Validate deployment identity configuration
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository variable ${name} is not configured."
              exit 1
            fi
          done
          readonly EXPECTED_OIDC_IDENTITY_SHA256="68e87a5dc1bbe2e41af33d526514034246c6487fb7b716596cc75fe1c739a6b9"
          actual_oidc_identity_sha256="$(
            printf '%s\0%s\0%s' \
              "$GCP_PROJECT_ID" \
              "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
              "$GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT" |
              sha256sum |
              awk '{print $1}'
          )"
          if [ "$actual_oidc_identity_sha256" != "$EXPECTED_OIDC_IDENTITY_SHA256" ]; then
            echo "::error::Repository OIDC identity variables do not match the reviewed identity contract."
            exit 1
          fi
      - name: Checkout workflow revision for release selection
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify approved workflow revision
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        shell: bash
        env:
          BINANCE_RUNTIME_WORKFLOW_SHA: ${{ vars.BINANCE_RUNTIME_WORKFLOW_SHA }}
          BINANCE_RUNTIME_RELEASE_SHA: ${{ vars.BINANCE_RUNTIME_RELEASE_SHA }}
          CANDIDATE_RELEASE_SHA: ${{ inputs.candidate_release_sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only || 'false' }}
          FULL_CYCLE: ${{ inputs.full_cycle || 'false' }}
          RUNTIME_TARGET_ENABLED: ${{ env.RUNTIME_TARGET_ENABLED }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only || 'false' }}
        run: |
          set -euo pipefail
          verified="$(python3 scripts/select_runtime_release_sha.py --verify-workflow)"
          if [[ ! "$verified" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Workflow revision verification returned an invalid SHA."
            exit 1
          fi
          echo "Verified workflow revision github.sha=${verified}."

      - name: Resolve approved runtime release SHA
        id: runtime-release
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        shell: bash
        env:
          BINANCE_RUNTIME_RELEASE_SHA: ${{ vars.BINANCE_RUNTIME_RELEASE_SHA }}
          CANDIDATE_RELEASE_SHA: ${{ inputs.candidate_release_sha }}
          VALIDATE_ONLY: ${{ inputs.validate_only || 'false' }}
          FULL_CYCLE: ${{ inputs.full_cycle || 'false' }}
          RUNTIME_TARGET_ENABLED: ${{ env.RUNTIME_TARGET_ENABLED }}
          RECONCILE_ONLY: ${{ inputs.reconcile_only || 'false' }}
          ACCOUNTING_MIGRATION_ACTION: ${{ inputs.accounting_migration_action || 'none' }}
          BINANCE_RUNTIME_WORKFLOW_SHA: ${{ vars.BINANCE_RUNTIME_WORKFLOW_SHA }}
        run: |
          set -euo pipefail
          source_kind=runtime_release
          if [ "$ACCOUNTING_MIGRATION_ACTION" = "earn-forward-diagnose" ] || [ "$ACCOUNTING_MIGRATION_ACTION" = "historical-continuity-diagnose" ]; then
            # This fixed read-only maintenance tool uses the already approved
            # workflow tree; it neither selects nor adopts a trading candidate.
            if [ -z "${BINANCE_RUNTIME_WORKFLOW_SHA:-}" ]; then
              echo "::error::Earn diagnosis requires an explicit workflow pin."
              exit 1
            fi
            selected="$(python3 scripts/select_runtime_release_sha.py --verify-workflow)"
            source_kind=earn_readonly
            if [ "$ACCOUNTING_MIGRATION_ACTION" = "historical-continuity-diagnose" ]; then source_kind=historical_readonly; fi
          else
            selected="$(python3 scripts/select_runtime_release_sha.py)"
          fi
          if [[ ! "$selected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release selection returned an invalid SHA."
            exit 1
          fi
          echo "sha=$selected" >> "$GITHUB_OUTPUT"
          echo "source_kind=$source_kind" >> "$GITHUB_OUTPUT"
          if [ "$source_kind" = "earn_readonly" ] || [ "$source_kind" = "historical_readonly" ]; then
            echo "Selected read-only tool SHA ${selected} (workflow github.sha=${GITHUB_SHA:-unknown})."
          else
            echo "Selected runtime release SHA ${selected} (workflow github.sha=${GITHUB_SHA:-unknown} is not used as the application execution identity)."
          fi

      - name: 1. Checkout approved runtime release
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.runtime-release.outputs.sha }}
          persist-credentials: false

      - name: Verify checkout matches selected runtime release SHA
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.runtime-release.outputs.sha }}
        run: |
          set -euo pipefail
          expected="${EXPECTED_RELEASE_SHA}"
          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::EXPECTED_RELEASE_SHA is invalid."
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checkout HEAD does not match the selected runtime release SHA"
            exit 1
          fi
          echo "Verified execution checkout HEAD=${actual} (distinct from workflow github.sha=${GITHUB_SHA:-unknown})."

      - name: 2. Authenticate to Google Cloud
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: 3. Prepare or update dependency environment
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        run: |
          set -euo pipefail
          LOCK_FILE="uv.lock"
          PYTHON_BIN="python3"
          if command -v python3.11 >/dev/null 2>&1; then PYTHON_BIN="python3.11"; fi
          echo "Using interpreter: $PYTHON_BIN ($($PYTHON_BIN --version 2>&1))"

          CACHE_ROOT="${RUNNER_WORKSPACE}/.runtime-cache/binance-platform"
          VENV_PATH="${CACHE_ROOT}/venv"
          # Keep the uv binary outside UV_PROJECT_ENVIRONMENT: project sync
          # removes packages not in the lockfile, including a uv installed into
          # the dependency venv (see run 35540307399).
          UV_TOOL_VENV="${CACHE_ROOT}/uv-tool"
          HASH_FILE="${CACHE_ROOT}/uv.lock.sha256"
          PYTHON_VERSION_FILE="${CACHE_ROOT}/python.version"
          CURR_HASH=$(sha256sum "$LOCK_FILE" | cut -d' ' -f1)
          CURR_PYTHON_VERSION="$("$PYTHON_BIN" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}")')"

          mkdir -p "$CACHE_ROOT"
          echo "VENV_PATH=$VENV_PATH" >> "$GITHUB_ENV"
          VENV_RECREATED=false

          install_with_retry() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              echo "${description} (attempt ${attempt}/3)"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 15))
              fi
            done
            return 1
          }

          ensure_tool_uv() {
            if [ -x "$UV_TOOL_VENV/bin/uv" ]; then
              echo "Reusing existing uv binary in tool venv (no upgrade)."
              return 0
            fi
            echo "Creating uv tool venv at $UV_TOOL_VENV."
            rm -rf "$UV_TOOL_VENV"
            "$PYTHON_BIN" -m venv "$UV_TOOL_VENV"
            if ! "$UV_TOOL_VENV/bin/python" -m pip --version >/dev/null 2>&1; then
              echo "pip missing from uv tool venv; bootstrapping with ensurepip (no upgrade)."
              "$UV_TOOL_VENV/bin/python" -m ensurepip
            fi
            # Do not upgrade pip or uv during production cycles: a fixed release
            # pin must not silently pull newer tooling from the network.
            # Cold caches still install whatever index resolves once; record the
            # resulting uv version in the runtime identity line below.
            install_with_retry "Install uv into tool venv without upgrade" \
              "$UV_TOOL_VENV/bin/python" -m pip install pip uv
          }

          if [ ! -x "$VENV_PATH/bin/python" ]; then
            echo "Creating dependency venv at $VENV_PATH."
            rm -rf "$VENV_PATH"
            "$PYTHON_BIN" -m venv "$VENV_PATH"
            VENV_RECREATED=true
          elif [ ! -f "$PYTHON_VERSION_FILE" ] || [ "$CURR_PYTHON_VERSION" != "$(cat "$PYTHON_VERSION_FILE")" ]; then
            echo "Python version changed; recreating dependency venv."
            rm -rf "$VENV_PATH"
            "$PYTHON_BIN" -m venv "$VENV_PATH"
            VENV_RECREATED=true
          fi
          if [ "$VENV_RECREATED" = "true" ]; then
            rm -f "$HASH_FILE" "$PYTHON_VERSION_FILE"
            # Interpreter change invalidates a cached tool uv built for the old
            # Python; drop it so ensure_tool_uv reinstalls without --upgrade.
            rm -rf "$UV_TOOL_VENV"
          fi

          ensure_tool_uv
          export UV_PROJECT_ENVIRONMENT="$VENV_PATH"
          UV_BIN="$UV_TOOL_VENV/bin/uv"

          if [ "$VENV_RECREATED" = "false" ] && [ -f "$HASH_FILE" ] && [ "$CURR_HASH" = "$(cat "$HASH_FILE")" ]; then
            echo "$LOCK_FILE unchanged; reusing cached venv."
          else
            echo "$LOCK_FILE changed or cache is cold; refreshing dependency venv."
          fi

          install_with_retry "Sync runtime dependencies" \
            env UV_PROJECT_ENVIRONMENT="$VENV_PATH" "$UV_BIN" sync --frozen --no-dev

          if [ "$VENV_RECREATED" = "true" ] || [ ! -f "$HASH_FILE" ] || [ "$CURR_HASH" != "$(cat "$HASH_FILE" 2>/dev/null || true)" ]; then
            echo "$CURR_HASH" > "$HASH_FILE"
            echo "$CURR_PYTHON_VERSION" > "$PYTHON_VERSION_FILE"
          fi

          # Must remain callable after project sync (tool venv is not the sync target).
          UV_VERSION_TEXT="$("$UV_BIN" --version)"
          if [[ ! "$CURR_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::uv.lock sha256 is invalid."
            exit 1
          fi
          if [[ ! "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GITHUB_SHA is invalid for runtime identity."
            exit 1
          fi
          if [ "${{ steps.runtime-release.outputs.source_kind }}" = "historical_readonly" ]; then
            echo "readonly_historical_identity workflow_sha=${GITHUB_SHA} tool_sha=${{ steps.runtime-release.outputs.sha }} uv_lock_sha256=${CURR_HASH} uv_version=${UV_VERSION_TEXT} python_version=${CURR_PYTHON_VERSION}"
          elif [ "${{ steps.runtime-release.outputs.source_kind }}" = "earn_readonly" ]; then
            echo "readonly_earn_identity workflow_sha=${GITHUB_SHA} tool_sha=${{ steps.runtime-release.outputs.sha }} uv_lock_sha256=${CURR_HASH} uv_version=${UV_VERSION_TEXT} python_version=${CURR_PYTHON_VERSION}"
          else
            echo "runtime_identity workflow_sha=${GITHUB_SHA} release_sha=${{ steps.runtime-release.outputs.sha }} uv_lock_sha256=${CURR_HASH} uv_version=${UV_VERSION_TEXT} python_version=${CURR_PYTHON_VERSION}"
          fi

      - name: Download approved accounting migration preview
        if: ${{ inputs.accounting_migration_action == 'apply' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binance-accounting-migration-preview
          path: reports/binance-accounting-migration-preview
          run-id: ${{ inputs.accounting_migration_preview_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Materialize protected LIVE risk authority source
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.validate_only == 'true' }}
        shell: bash
        env:
          BINANCE_RISK_AUTHORITY_JSON: ${{ secrets.BINANCE_RISK_AUTHORITY_JSON }}
          BINANCE_RISK_AUTHORITY_FILE_CONFIG: ${{ vars.BINANCE_RISK_AUTHORITY_FILE }}
        run: |
          set -euo pipefail
          if [ -n "${BINANCE_RISK_AUTHORITY_JSON:-}" ] && [ -n "${BINANCE_RISK_AUTHORITY_FILE_CONFIG:-}" ]; then
            echo "::error::LIVE risk authority source is configured twice."
            exit 1
          fi
          if [ -n "${BINANCE_RISK_AUTHORITY_JSON:-}" ]; then
            umask 077
            authority_file="$(mktemp "$RUNNER_TEMP/binance-live-risk-authority.XXXXXX")"
            printf '%s' "$BINANCE_RISK_AUTHORITY_JSON" > "$authority_file"
            chmod 600 "$authority_file"
            echo "BINANCE_RISK_AUTHORITY_FILE=$authority_file" >> "$GITHUB_ENV"
            echo "BINANCE_RISK_AUTHORITY_TEMP_FILE=$authority_file" >> "$GITHUB_ENV"
          elif [ -n "${BINANCE_RISK_AUTHORITY_FILE_CONFIG:-}" ]; then
            echo "BINANCE_RISK_AUTHORITY_FILE=$BINANCE_RISK_AUTHORITY_FILE_CONFIG" >> "$GITHUB_ENV"
          fi

      # Keep this stable step name: the isolation contract verifies that broker
      # credentials are scoped only here.  `reconcile_only` exits before
      # `main.py` and has no order path.
      - name: 4. Run trading strategy
        id: strategy
        if: ${{ env.RUNTIME_TARGET_ENABLED == 'true' || github.event.inputs.reconcile_only == 'true' || github.event.inputs.validate_only == 'true' }}
        run: |
          set -euo pipefail
          if [ -z "${RUNTIME_TARGET_JSON:-}" ]; then
            echo "::error::Strategy entry requires RUNTIME_TARGET_JSON; unknown target control fails closed."
            exit 1
          fi
          if [ "${VALIDATE_ONLY:-false}" = "true" ]; then
            if [ "${RUNTIME_TARGET_ENABLED:-}" != "false" ]; then
              echo "::error::validate_only/full-cycle requires RUNTIME_TARGET_ENABLED=false."
              exit 1
            fi
            if [ "${FULL_CYCLE:-false}" = "true" ]; then
              RUNTIME_TARGET_ENABLED=false "$VENV_PATH/bin/python" - <<'SAFE_VALIDATION'
          import contextlib
          import copy
          import io
          import logging
          import json
          import os
          import subprocess
          import sys

          # Capture the sole existing validator. Child/provider diagnostics never reach logs.
          result = {"status": "failed", "reason_code": "validation_input_invalid",
                    "validation_scope": "full_cycle_no_submit", "execution_permitted": False}
          process = None
          allowed_reasons = {
              "earn_checkpoint_required_for_receipt",
              "earn_forward_accounting_unverified",
              "balance_change_unexplained",
              "external_cash_flow_reconciliation_uncertain",
              "daily_accounting_unverifiable",
              "daily_trend_accounting_migration_unverifiable",
              "daily_trend_accounting_unverifiable",
              "external_cash_flow_cursor_missing",
              "external_cash_flow_late_completion",
              "external_cash_flow_balance_mismatch",
              "external_withdrawal_accounting_unsupported",
              "external_cash_flow_scope_unsupported",
              "earn_accounted_changes_missing",
              "earn_cash_cursor_mismatch",
              "earn_cash_flow_invalid",
              "earn_cash_flow_time_unverified",
              "earn_cash_flow_unsupported",
              "earn_checkpoint_invalid",
              "earn_checkpoint_scope_changed",
              "earn_checkpoint_time_invalid",
              "earn_counter_reset",
              "earn_order_unsettled",
              "earn_product_lifecycle_unverified",
              "earn_quantity_change_unexplained",
              "earn_valuation_snapshot_mismatch",
              "external_cash_flow_cursor_capacity_exceeded",
              "external_cash_flow_cursor_invalid",
              "external_cash_flow_history_incomplete",
              "external_cash_flow_history_read_failed",
              "external_cash_flow_record_changed",
              "external_cash_flow_record_invalid",
              "external_cash_flow_window_invalid",
              "authority_decision_not_approve",
              "authority_duplicate_field",
              "authority_expired_or_not_effective",
              "authority_fields_invalid",
              "authority_file_changed",
              "authority_file_digest_mismatch",
              "authority_file_invalid",
              "authority_file_unreadable",
              "authority_json_invalid",
              "authority_material_invalid",
              "authority_non_finite_value",
              "authority_scope_not_live",
              "authority_source_incomplete",
              "config_digest_mismatch",
              "full_cycle_aborted",
              "full_cycle_broker_asset_forbidden",
              "full_cycle_broker_checkpoint_forbidden",
              "full_cycle_broker_connect_failed",
              "full_cycle_broker_dividend_window_forbidden",
              "full_cycle_broker_market_read_forbidden",
              "full_cycle_broker_market_window_forbidden",
              "full_cycle_broker_method_forbidden",
              "full_cycle_broker_read_failed",
              "full_cycle_broker_request_forbidden",
              "full_cycle_broker_symbol_forbidden",
              "full_cycle_build_failed",
              "full_cycle_cycle_error",
              "full_cycle_cycle_failed",
              "full_cycle_execution_blocked",
              "full_cycle_funding_or_execution_blocked",
              "full_cycle_import_failed",
              "full_cycle_no_submit",
              "full_cycle_not_complete",
              "full_cycle_notification_forbidden",
              "full_cycle_owner_claim_forbidden",
              "full_cycle_owner_release_forbidden",
              "full_cycle_requires_disabled_runtime",
              "full_cycle_risk_authority_missing",
              "full_cycle_risk_rejected",
              "full_cycle_side_effect_executed",
              "full_cycle_state_loader_missing",
              "full_cycle_state_snapshot_unavailable",
              "full_cycle_state_write_forbidden",
              "full_cycle_validation",
              "full_cycle_validation_failed",
              "full_cycle_write_port_called",
              "recovery_active_binding_invalid",
              "recovery_control_read_failed",
              "recovery_control_state_invalid",
              "runner_checkout_dirty",
              "runner_revision_mismatch",
              "runner_revision_unavailable",
              "runtime_recovery_not_active",
              "runtime_target_disabled",
              "runtime_target_identity_ambiguous",
              "runtime_target_identity_incomplete",
              "runtime_target_mismatch",
              "runtime_target_missing",
              "startup_dry_run_conflict",
              "startup_only",
              "startup_strategy_profile_conflict",
              "startup_validation_broker_credentials_forbidden",
              "startup_validation_execution_permitted",
              "startup_validation_requires_disabled_runtime",
              "startup_validation_state_load_failed",
              "strategy_revision_mismatch",
              "strategy_revision_unavailable",
          }
          allowed_stages = {"import", "build", "state", "connect", "cycle", "result",
                            "client_connect", "state_load", "funding_reconciliation",
                            "pool_diagnostics", "market_snapshot", "portfolio_allocation",
                            "daily_state", "circuit_breaker", "fuel_execution", "trend_execution",
                            "post_trade_allocation", "btc_execution", "earn_execution",
                            "status_notification", "state_persistence", "state_owner_claim",
                            "state_owner_release"}
          # Exact types already emitted by the pinned validator; never provider text.
          allowed_error_types = {
              "state_persistence_error", "order_reconciliation_error", "execution_integrity_error",
              "client_call_error", "timeout_error", "connection_error", "permission_error",
              "io_error", "value_error", "type_error", "key_error", "runtime_error",
              "unclassified_error", "ValueError", "KeyError", "TypeError", "OSError", "RuntimeError",
          }
          try:
              from quant_platform_kit.common.live_continuity import runtime_target_fingerprint
              from quant_platform_kit.common.runtime_target import resolve_runtime_target_from_env

              if os.environ.get("RUNTIME_TARGET_ENABLED") != "false":
                  raise ValueError("disabled_validation_required")
              original = json.loads(os.environ["RUNTIME_TARGET_JSON"])
              source_target = resolve_runtime_target_from_env(
                  env={"RUNTIME_TARGET_JSON": json.dumps(original)}, expected_platform_id="binance",
              )
              if original["live_continuity"]["state"] != "RECONCILE_ONLY":
                  raise ValueError("reconciliation_continuity_required")
              legacy_profile = os.environ.get("STRATEGY_PROFILE", "").strip()
              if legacy_profile and legacy_profile != source_target.strategy_profile:
                  raise ValueError("source_profile_conflict")
              legacy_dry = os.environ.get("BINANCE_DRY_RUN", "").strip().lower()
              if legacy_dry not in {"true", "false"} or (legacy_dry == "true") != source_target.dry_run_only:
                  raise ValueError("source_dry_run_conflict")
              # Verify the original LIVE recovery/source/authority contract before
              # deriving a diagnostic copy. The existing builder has no client or
              # write ports unless explicitly supplied; this call supplies none.
              result["reason_code"] = "source_binding_invalid"
              previous_logging_disable = logging.root.manager.disable
              try:
                  logging.disable(logging.CRITICAL)
                  with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                      from runtime_config_support import build_live_runtime as build_source_runtime
                      source_runtime = build_source_runtime()
              finally:
                  logging.disable(previous_logging_disable)
              if (source_runtime.dry_run is not False
                      or source_runtime.standard_execution_permitted is not False
                      or source_runtime.risk_authority is None
                      or source_runtime.runtime_target.live_continuity.state != "ACTIVE_LKG"
                      or any(getattr(source_runtime, port, None) is not None for port in (
                          "client", "state_loader", "state_writer", "notifier",
                          "state_owner_claim", "state_owner_release"))):
                  raise ValueError("disabled_live_source_required")
              # Reuse the existing isolated validator's process-only paper target.
              # Keep account identity, continuity and LIVE authority/source bindings intact.
              target = copy.deepcopy(original)
              target["dry_run_only"] = True
              target["execution_mode"] = "paper"
              target["live_continuity"]["baseline_target_sha256"] = runtime_target_fingerprint(target)
              child_env = dict(os.environ)
              child_env["RUNTIME_TARGET_JSON"] = json.dumps(target, sort_keys=True)
              child_env["RUNTIME_TARGET_ENABLED"] = "false"
              child_env["BINANCE_DRY_RUN"] = "true"
              resolved = resolve_runtime_target_from_env(env=child_env, expected_platform_id="binance")
              if not resolved.dry_run_only or resolved.live_continuity.permits_standard_execution:
                  raise ValueError("validation_target_invalid")
              child_env["STRATEGY_PROFILE"] = resolved.strategy_profile
              result["reason_code"] = "validator_output_invalid"
              process = subprocess.run(
                  [sys.executable, "scripts/validate_runtime_startup.py", "--full-cycle"],
                  capture_output=True, text=True, check=False, env=child_env,
              )
              candidate = json.loads(process.stdout.strip().splitlines()[-1])
              if candidate.get("status") == "passed" and process.returncode == 0:
                  if (candidate.get("validation_scope") != "full_cycle_no_submit"
                          or candidate.get("cycle_complete") is not True
                          or candidate.get("execution_permitted") is not False
                          or candidate.get("risk_outcome") != "APPROVE"):
                      raise ValueError("invalid_validation_contract")
                  for key in ("broker_read_count", "suppressed_side_effect_count",
                              "suppressed_strategy_record_count"):
                      value = candidate[key]
                      if type(value) is not int or not 0 <= value <= 10000000:
                          raise ValueError("invalid_counter")
                      result[key] = value
                  result.update(status="passed", reason_code="full_cycle_complete",
                                cycle_complete=True, risk_outcome="APPROVE", executed_call_count=0)
              else:
                  result["reason_code"] = (candidate.get("reason_code")
                                           if candidate.get("reason_code") in allowed_reasons
                                           else "validator_failed")
                  if candidate.get("failure_stage") in allowed_stages:
                      result["failure_stage"] = candidate["failure_stage"]
                  error_type = candidate.get("error_type")
                  result["error_type"] = (error_type
                                          if type(error_type) is str and error_type in allowed_error_types
                                          else "unknown")
          except Exception:
              pass
          if process is not None:
              result["validator_exit_code"] = process.returncode
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(0 if result["status"] == "passed" else 1)
          SAFE_VALIDATION
            else
              env -u BINANCE_API_KEY -u BINANCE_API_SECRET RUNTIME_TARGET_ENABLED=false \
                "$VENV_PATH/bin/python" scripts/validate_runtime_startup.py
            fi
            exit 0
          fi
          if [ "${RECONCILE_ONLY:-false}" = "true" ]; then
            if [ "${ACCOUNTING_MIGRATION_ACTION:-none}" = "earn-forward-diagnose" ] || [ "${ACCOUNTING_MIGRATION_ACTION:-none}" = "historical-continuity-diagnose" ]; then
              "$VENV_PATH/bin/python" - <<'SAFE_EARN_DIAGNOSIS'
          import json
          import os
          import subprocess
          import sys

          result = {"status": "blocked", "reason_code": "earn_diagnosis_output_invalid",
                    "diagnostic_scope": "earn_forward_readonly", "execution_permitted": False}
          process = None
          try:
              from scripts.migrate_daily_accounting_state import project_earn_diagnosis
              action = "earn-forward-diagnose"
              projector = project_earn_diagnosis
              if os.environ.get("ACCOUNTING_MIGRATION_ACTION") == "historical-continuity-diagnose":
                  result = {"status": "blocked", "reason_code": "historical_readonly_failed",
                            "diagnostic_scope": "historical_continuity_readonly", "execution_permitted": False}
                  from scripts.historical_continuity_readonly import project_result
                  action = "historical-continuity-diagnose"
                  projector = project_result
                  result = projector(None, exit_code=1)
              child_env = dict(os.environ)
              for key in ("BINANCE_RISK_AUTHORITY_FILE", "BINANCE_RISK_AUTHORITY_JSON",
                          "BINANCE_RISK_AUTHORITY_SHA256", "BINANCE_RISK_AUTHORITY_SOURCE_REVISION"):
                  child_env.pop(key, None)
              process = subprocess.run(
                  [sys.executable, "scripts/migrate_daily_accounting_state.py", action],
                  capture_output=True, text=True, check=False, env=child_env,
              )
              value = json.loads(process.stdout.strip().splitlines()[-1])
              result = projector(value, exit_code=process.returncode)
          except Exception:
              pass
          if process is not None:
              result["diagnostic_exit_code"] = process.returncode
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(0 if result["status"] == "diagnosed" else 1)
          SAFE_EARN_DIAGNOSIS
              exit 0
            fi
            if [ "${ACCOUNTING_MIGRATION_ACTION:-none}" != "none" ]; then
              args=("$ACCOUNTING_MIGRATION_ACTION")
              if [ "$ACCOUNTING_MIGRATION_ACTION" = "apply" ]; then
                args+=(--expected-digest "$ACCOUNTING_MIGRATION_EXPECTED_DIGEST")
              fi
              "$VENV_PATH/bin/python" scripts/migrate_daily_accounting_state.py "${args[@]}"
              exit 0
            fi
            if [ "${RECOVERY_ACTION:-none}" != "none" ]; then
              "$VENV_PATH/bin/python" scripts/binance_recovery_controller.py "$RECOVERY_ACTION" --recovery-id "${RECOVERY_ID:-}"
              exit 0
            fi
            if [ "${DIAGNOSE_BALANCES:-false}" = "true" ]; then
              args=(--no-persist --diagnose-balances)
              if [ -n "${BALANCE_HISTORY_START:-}" ]; then
                args+=(--history-start "$BALANCE_HISTORY_START" --history-end "$BALANCE_HISTORY_END")
              fi
              "$VENV_PATH/bin/python" scripts/reconcile_frozen_live_baseline.py "${args[@]}"
              exit 0
            fi
            args=(--no-persist)
            if [ "${RECONCILE_PERSIST_CANDIDATE:-false}" = "true" ]; then
              args=(--output reports/binance-reconciliation-candidate.json)
            fi
            "$VENV_PATH/bin/python" scripts/reconcile_frozen_live_baseline.py "${args[@]}"
            exit 0
          fi
          if [ "${RUNTIME_TARGET_ENABLED:-}" != "true" ]; then
            echo "::error::Live strategy entry requires RUNTIME_TARGET_ENABLED=true."
            exit 1
          fi
          "$VENV_PATH/bin/python" -c "from runtime_config_support import assert_standard_execution_entry_permitted; assert_standard_execution_entry_permitted(); print('runtime_control_ok')"
          "$VENV_PATH/bin/python" main.py
        env:
          RUNTIME_SOURCE_KIND: ${{ steps.runtime-release.outputs.source_kind }}
          BINANCE_RUNTIME_WORKFLOW_SHA: ${{ vars.BINANCE_RUNTIME_WORKFLOW_SHA }}
          RECOVERY_ACTION: ${{ inputs.recovery_action || 'none' }}
          RECOVERY_ID: ${{ inputs.recovery_id }}
          RECONCILIATION_RECOVERY_SYNC_TOKEN: ${{ (inputs.recovery_action == 'prepare' || inputs.accounting_migration_action == 'scope-preview') && secrets.RECONCILIATION_RECOVERY_SYNC_TOKEN || '' }}
          RECONCILIATION_RECOVERY_CONTROLLER_TOKEN: ${{ (inputs.recovery_action == 'verify' || inputs.recovery_action == 'activate') && secrets.RECONCILIATION_RECOVERY_CONTROLLER_TOKEN || '' }}
          GITHUB_TOKEN: ${{ (inputs.accounting_migration_action == 'historical-continuity-diagnose' || inputs.recovery_action == 'diagnose' || inputs.recovery_action == 'prepare' || inputs.recovery_action == 'verify' || inputs.recovery_action == 'activate') && secrets.GITHUB_TOKEN || '' }}
          BINANCE_RECOVERY_CONTROL_ENABLED: ${{ vars.BINANCE_RECOVERY_CONTROL_ENABLED || 'false' }}
          BINANCE_APPROVED_PROSPECTIVE_OPENING: ${{ inputs.accounting_migration_action == 'prospective-rebase-apply' && secrets.BINANCE_APPROVED_PROSPECTIVE_OPENING || '' }}
