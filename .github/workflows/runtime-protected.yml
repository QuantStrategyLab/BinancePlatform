          RUNTIME_TARGET_JSON: ${{ secrets.PRIVATE_RUNTIME_TARGET_JSON }}
          RUNTIME_TARGET_ENABLED: ${{ env.RUNTIME_TARGET_ENABLED }}
          BINANCE_RISK_AUTHORITY_SHA256: ${{ vars.BINANCE_RISK_AUTHORITY_SHA256 }}
          BINANCE_RISK_AUTHORITY_SOURCE_REVISION: ${{ vars.BINANCE_RISK_AUTHORITY_SOURCE_REVISION }}
          BINANCE_RECONCILIATION_EXPECTED_DIGESTS_JSON: ${{ vars.BINANCE_RECONCILIATION_EXPECTED_DIGESTS_JSON }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.PRIVATE_GLOBAL_TELEGRAM_CHAT_ID }}
          NOTIFY_LANG: ${{ vars.NOTIFY_LANG }}
          BINANCE_UNIFIED_NOTIFICATION_ENABLED: ${{ vars.BINANCE_UNIFIED_NOTIFICATION_ENABLED || 'false' }}
          DIGEST_OPAQUE_ACCOUNT_UID: ${{ secrets.DIGEST_OPAQUE_ACCOUNT_UID || secrets.BINANCE_DIGEST_OPAQUE_ACCOUNT_UID }}
          DIGEST_TARGET_ID: ${{ secrets.DIGEST_TARGET_ID || secrets.BINANCE_DIGEST_TARGET_ID }}
          DIGEST_STORE_TARGET: ${{ secrets.PRIVATE_DIGEST_STORE_TARGET || secrets.BINANCE_DIGEST_STORE_TARGET }}
          DIGEST_CANDIDATES_GCS_URI: ${{ secrets.PRIVATE_DIGEST_CANDIDATES_GCS_URI || secrets.DIGEST_CANDIDATES_GCS_URI }}
          EXECUTION_REPORT_GCS_URI: ${{ secrets.PRIVATE_EXECUTION_REPORT_GCS_URI }}
          BINANCE_LIFECYCLE_EXPORT_PATH: ${{ runner.temp }}/binance-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}/lifecycle-run.json
          BINANCE_DRY_RUN: ${{ vars.BINANCE_DRY_RUN || 'true' }}
