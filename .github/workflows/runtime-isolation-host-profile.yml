name: Runtime Isolation Host Profile

on:
  workflow_dispatch:
    inputs:
      check_binance_public_api:
        description: "One unauthenticated public ping from the actual runner; no account reads or writes"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  profile-current-runner:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout BinancePlatform
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Collect redacted host, egress, and secret-boundary profile
        env:
          CHECK_BINANCE_PUBLIC_API: ${{ inputs.check_binance_public_api }}
          RUNTIME_EGRESS_CHECK_URL: ${{ vars.BINANCE_RUNTIME_EGRESS_CHECK_URL }}
          RUNTIME_EXPECTED_EGRESS_SHA256: ${{ vars.BINANCE_RUNTIME_EGRESS_SHA256 }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$CHECK_BINANCE_PUBLIC_API" == "true" ]]; then
            args+=(--check-binance-public-api)
          fi
          python3 scripts/runtime_isolation_host_probe.py "${args[@]}" \
            --workflow .github/workflows/main.yml \
            --output reports/runtime_isolation_host_profile.json

      - name: Upload redacted host profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-isolation-host-profile-${{ github.run_id }}
          path: reports/runtime_isolation_host_profile.json
          if-no-files-found: error
          retention-days: 7
