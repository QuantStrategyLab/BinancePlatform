name: Runtime Heartbeat

on:
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Runtime workflow lookback window in hours."
        required: false
        type: string
        default: "2.5"
      fail_workflow_on_alert:
        description: "Fail this workflow when an alert is emitted."
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
  schedule:
    - cron: "35 * * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Check Runtime workflow heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      RUNTIME_HEARTBEAT_NAME: BinancePlatform Runtime
      RUNTIME_HEARTBEAT_WORKFLOW: main.yml
      RUNTIME_HEARTBEAT_LOOKBACK_HOURS: ${{ inputs.lookback_hours || vars.RUNTIME_HEARTBEAT_LOOKBACK_HOURS || '2.5' }}
      RUNTIME_HEARTBEAT_EXPECTED_INTERVAL_HOURS: ${{ vars.RUNTIME_HEARTBEAT_EXPECTED_INTERVAL_HOURS || '1' }}
      RUNTIME_HEARTBEAT_MAX_CONSECUTIVE_MISSES: ${{ vars.RUNTIME_HEARTBEAT_MAX_CONSECUTIVE_MISSES || '2' }}
      RUNTIME_HEARTBEAT_FAIL_WORKFLOW_ON_ALERT: ${{ inputs.fail_workflow_on_alert || vars.RUNTIME_HEARTBEAT_FAIL_WORKFLOW_ON_ALERT || 'true' }}
      RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED || 'false' }}
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ vars.GLOBAL_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      - name: Check recent Runtime workflow success
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python scripts/runtime_workflow_heartbeat.py
