name: Runner Scheduler Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Checkout reviewed main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Observe scheduler state
        run: python3 -m scripts.runtime_scheduler_probe
