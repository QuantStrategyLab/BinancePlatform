target-version = "py311"

[lint]
ignore = ["E701", "E702", "E401", "F541"]

[lint.per-file-ignores]
"tests/*.py" = ["E402"]
"research/backtest.py" = ["E402"]
"run_cycle_replay.py" = ["E402"]
# Platform entry split: main re-exports and runtime_wiring keep import aliases
# for monkeypatch / cross-module access even when unused inside the file body.
"main.py" = ["E402", "F822"]
"runtime_wiring.py" = ["F401"]
# Preserve the byte-pinned upstream receiver used only by contract tests.
"tests/fixtures/qrs_notification_contract/daily_digest_aggregator.py" = ["F841"]
"tests/fixtures/qrs_notification_contract/unified_daily_digest.py" = ["F401"]
